# Every value can be overridden with an environment variable prefixed RP__,
# with a double underscore between nesting levels. For example
# RP__APP__API_KEY and RP__STORAGE__S3__SECRET_ACCESS_KEY.

[app]
listen = "0.0.0.0:6100"
metrics_listen = "0.0.0.0:6101"
# libvips threads per operation. Multiply by worker_threads for total CPU use.
vips_concurrency = 1
# libvips operation cache, 0 disables it (recommended for a service)
vips_cache_max_mem_mb = 0
max_body_size_mb = 100
api_key = "test"
enable_openapi = false

# Optional, defaults shown
# worker_threads = 8                  # image processing threads, defaults to CPU count
# upload_concurrency = 4              # uploads in flight per process request
# max_output_dimension = 4096         # largest side any output may have
# scale_quality = 80                  # JPEG quality on the /scale endpoint
# scale_cache_control = "public, max-age=31536000, immutable"
# request_timeout_secs = 60

[storage]
storage_type = "S3"

[storage.s3]
bucket = "your-bucket"
endpoint = "http://localhost:9008"
base_url = "http://localhost:9008/your-bucket"
force_path_style = true
region = "auto"
# Leave both unset to use the AWS default credential chain
# (environment, shared config, IAM role, IRSA)
access_key_id = "access_key_id"
secret_access_key = "secret_access_key"

