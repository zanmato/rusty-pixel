name: Build and Push Docker Image

on:
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: rusty-pixel

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The notes go through a file, never through ${{ }} interpolation, so
    # backticks and $ in the changelog are not run as shell code.
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        NOTES="${RUNNER_TEMP}/release-notes.md"

        # Print the lines between "## [VERSION]" and the next "## [" heading.
        # index() matches the heading literally, so the dots in the version
        # are not regex wildcards.
        awk -v heading="## [${VERSION}]" '
          index($0, heading) == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > "$NOTES"

        if ! grep -q '[^[:space:]]' "$NOTES"; then
          echo "::error::No changelog section found for ${VERSION} in CHANGELOG.md"
          exit 1
        fi

        printf '\n**Docker image:** `%s:%s`\n' "$IMAGE" "$VERSION" >> "$NOTES"

        gh release create "${GITHUB_REF_NAME}" \
          --title "${GITHUB_REF_NAME}" \
          --notes-file "$NOTES"
